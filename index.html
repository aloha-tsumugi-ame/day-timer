<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>24h Day Timer (Clean Blue + Adaptive)</title>
  <style>
    :root{
      --bg: #ffffff;
      --text: #111827;
      --muted: rgba(17,24,39,.65);

      --card: #ffffff;
      --cardBorder: rgba(17,24,39,.10);
      --shadow: rgba(0,0,0,.10);

      --track: rgba(17,24,39,.08);
      --tick: rgba(17,24,39,.22);
      --tickStrong: rgba(17,24,39,.45);

      /* ここはJSで動的に差し替える */
      --accent: #93c5fd;       /* fill */
      --accentEdge: rgba(59,130,246,.18); /* ring edge */

      --hand: rgba(17,24,39,.75);
    }

    body{
      margin:0; height:100vh; display:grid; place-items:center;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    .wrap{
      display:grid; gap:16px; justify-items:center;
      padding: 18px 18px 14px;
      background: var(--card);
      border: 1px solid var(--cardBorder);
      border-radius: 22px;
      box-shadow: 0 18px 50px var(--shadow);
    }

    svg{ width: 340px; height: 340px; }

    .meta{ text-align:center; }
    .time{
      font-size: 34px;
      font-variant-numeric: tabular-nums;
      letter-spacing: .02em;
    }
    .pct{
      font-size: 15px;
      color: var(--muted);
      font-variant-numeric: tabular-nums;
    }

    .hourLabel{
      font-size: 11px;          /* 小さめ */
      font-weight: 400;         /* 太字にしない */
      fill: rgba(17,24,39,.65); /* 少し薄め */
    }
  </style>
</head>
<body>
<div class="wrap">
  <svg viewBox="0 0 200 200" aria-label="24h dial">
    <defs>
      <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
        <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="rgba(0,0,0,.12)"/>
      </filter>
    </defs>

    <!-- ベース -->
    <circle cx="100" cy="100" r="86" fill="#fff" filter="url(#soft)"/>
    <circle cx="100" cy="100" r="80" fill="#fff" stroke="rgba(17,24,39,.10)" stroke-width="1"/>

    <!-- トラック -->
    <circle cx="100" cy="100" r="70" fill="none" stroke="var(--track)" stroke-width="14"/>

    <!-- 経過扇形（右回りで増える） -->
    <path id="elapsedSector" fill="var(--accent)" opacity="0.95"></path>

    <!-- うっすら縁取り -->
    <circle id="accentEdgeRing" cx="100" cy="100" r="70" fill="none" stroke="var(--accentEdge)" stroke-width="14"/>

    <!-- 目盛り・ラベル -->
    <g id="ticks"></g>
    <g id="labels"></g>

    <!-- 境界針 -->
    <line id="hand" x1="100" y1="100" x2="100" y2="28"
          stroke="var(--hand)" stroke-width="3.2" stroke-linecap="round"/>

    <!-- 中心ノブ -->
    <circle cx="100" cy="100" r="9" fill="rgba(17,24,39,.75)"/>
    <circle cx="100" cy="100" r="5" fill="rgba(255,255,255,.65)"/>
  </svg>

  <div class="meta">
    <div class="time" id="remaining"></div>
    <div class="pct" id="pct"></div>
  </div>
</div>

<script>
  const elapsedSector = document.getElementById("elapsedSector");
  const ticksG = document.getElementById("ticks");
  const labelsG = document.getElementById("labels");
  const hand = document.getElementById("hand");

  const remainingEl = document.getElementById("remaining");
  const pctEl = document.getElementById("pct");

  const cx = 100, cy = 100;
  const rOuter = 70;
  const startAngle = -90;     // 12時
  const totalHours = 24;

  function pad(n){ return String(n).padStart(2,"0"); }

  // 画面座標はyが下向きなので、角度を増やすと時計回りになる
  function polarToXY(cx, cy, r, deg){
    const rad = (deg * Math.PI) / 180;
    return { x: cx + r * Math.cos(rad), y: cy + r * Math.sin(rad) };
  }

  // 中心から塗る円扇形
  function sectorPath(cx, cy, r, startDeg, endDeg){
    if (endDeg <= startDeg) return "";
    const delta = endDeg - startDeg;
    const largeArc = delta > 180 ? 1 : 0;
    const p1 = polarToXY(cx, cy, r, startDeg);
    const p2 = polarToXY(cx, cy, r, endDeg);
    return [
      `M ${cx} ${cy}`,
      `L ${p1.x} ${p1.y}`,
      `A ${r} ${r} 0 ${largeArc} 1 ${p2.x} ${p2.y}`,
      `Z`
    ].join(" ");
  }

  function setHandAngle(deg){
    const tip = polarToXY(cx, cy, 72, deg);
    hand.setAttribute("x2", tip.x);
    hand.setAttribute("y2", tip.y);
  }

  // 残り割合に応じて色を変更（シンプル：段階的）
  function applyAccentByRemaining(remainingRatio){
    // 目安：残りが減るほど “注意色” へ
    // 1.00 → 薄い青
    // 0.50 → 少し濃い青
    // 0.20 → 紫寄り
    // 0.08 → オレンジ寄り
    let accent = "#93c5fd";
    let edge = "rgba(59,130,246,.18)";

    if (remainingRatio <= 0.50) {
      accent = "#60a5fa";
      edge = "rgba(37,99,235,.22)";
    }
    if (remainingRatio <= 0.20) {
      accent = "#a78bfa";
      edge = "rgba(124,58,237,.20)";
    }
    if (remainingRatio <= 0.08) {
      accent = "#fdba74";
      edge = "rgba(249,115,22,.20)";
    }

    document.documentElement.style.setProperty("--accent", accent);
    document.documentElement.style.setProperty("--accentEdge", edge);
  }

  // 目盛り：1時間ごと。強目盛り：6時間ごと。
  // ラベル：3時間ごと（0,3,6,9,12,15,18,21）
  function buildDial(){
    const tickR1 = 78;
    const tickR2Small = 71;
    const tickR2Strong = 66;
    const labelR = 54;

    for(let h=0; h<totalHours; h++){
      const deg = startAngle + (360 * (h / totalHours));
      const p1 = polarToXY(cx, cy, tickR1, deg);

      const isStrong = (h % 6 === 0);
      const p2 = polarToXY(cx, cy, isStrong ? tickR2Strong : tickR2Small, deg);

      const line = document.createElementNS("http://www.w3.org/2000/svg","line");
      line.setAttribute("x1", p1.x); line.setAttribute("y1", p1.y);
      line.setAttribute("x2", p2.x); line.setAttribute("y2", p2.y);
      line.setAttribute("stroke", isStrong ? "var(--tickStrong)" : "var(--tick)");
      line.setAttribute("stroke-width", isStrong ? "2.2" : "1.2");
      line.setAttribute("stroke-linecap","round");
      ticksG.appendChild(line);

      // 3時間ごとに数字
      if (h % 3 === 0){
        const lp = polarToXY(cx, cy, labelR, deg);
        const text = document.createElementNS("http://www.w3.org/2000/svg","text");
        text.setAttribute("x", lp.x);
        text.setAttribute("y", lp.y + 4);
        text.setAttribute("text-anchor","middle");
        text.setAttribute("class","hourLabel");
        text.setAttribute("font-weight", (h % 6 === 0) ? "700" : "400");
        text.textContent = String(h);
        labelsG.appendChild(text);
      }
    }
  }
  buildDial();

  function tick(){
    const now = new Date();

    // 今日の終わり（明日0:00）
    const end = new Date(now);
    end.setDate(now.getDate() + 1);
    end.setHours(0,0,0,0);

    const totalMs = 24 * 60 * 60 * 1000;
    const remainingMs = Math.max(0, end - now);
    const remainingRatio = remainingMs / totalMs;
    const elapsedRatio = 1 - remainingRatio;

    // 色を更新
    applyAccentByRemaining(remainingRatio);

    const hrs = Math.floor(remainingMs / 3600000);
    const mins = Math.floor((remainingMs % 3600000) / 60000);
    const secs = Math.floor((remainingMs % 60000) / 1000);

    // 右回りで「経過」が増える
    const endAngle = startAngle + 360 * elapsedRatio;
    elapsedSector.setAttribute("d", sectorPath(cx, cy, rOuter, startAngle, endAngle));
    setHandAngle(endAngle);

    const remainingStr = `${pad(hrs)}:${pad(mins)}:${pad(secs)}`;
    const remainPct = remainingRatio * 100;
    const elapsedPct = elapsedRatio * 100;

    remainingEl.textContent = `残り ${remainingStr}`;
    pctEl.textContent = `残り ${remainPct.toFixed(2)}% / 経過 ${elapsedPct.toFixed(2)}%`;
  }

  tick();
  setInterval(tick, 250);
</script>
</body>
</html>
